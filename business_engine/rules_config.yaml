# Business Engine Action Costs, Expected Save Rates, and Rules Mapping

actions:
  loyalty_discount:
    name: "20% Loyalty Bill Discount (6 months)"
    cost: 150.0
    expected_save_rate: 0.45
    description: "Provide a 20% discount on monthly bill for 6 months to high-value at-risk customers."
  
  proactive_support:
    name: "Priority Tech Support Outreach"
    cost: 50.0
    expected_save_rate: 0.35
    description: "Assign a dedicated senior support engineer to resolve outstanding network/billing issues."

  plan_upgrade_offer:
    name: "Bonus Data & Speed Boost Upgrade"
    cost: 80.0
    expected_save_rate: 0.40
    description: "Offer a free data pack upgrade to re-engage declining data usage subscribers."

  contract_incentive:
    name: "1-Year Contract Renewal Bonus"
    cost: 120.0
    expected_save_rate: 0.50
    description: "Provide device upgrade voucher upon signing a 12-month renewal contract."

  standard_survey:
    name: "Automated Feedback Survey & Check-in"
    cost: 10.0
    expected_save_rate: 0.15
    description: "Send automated check-in SMS and offer standard feedback token."

risk_tiers:
  high:
    prob_min: 0.70
  medium:
    prob_min: 0.35
  low:
    prob_min: 0.00

drift:
  psi_low: 0.10      # PSI < 0.10 -> STABLE
  psi_medium: 0.25   # 0.10 <= PSI < 0.25 -> WARNING
  psi_high: 0.25     # PSI >= 0.25 -> CRITICAL

performance_degradation:
  precision_baseline: 0.8392
  recall_baseline: 1.0000
  f1_baseline: 0.9125
  roc_auc_baseline: 0.9432
  pr_auc_baseline: 0.8719
  warning_drop_pct: 0.05    # > 5% drop in F1/ROC-AUC -> WARNING
  critical_drop_pct: 0.15   # > 15% drop in F1/ROC-AUC -> CRITICAL

data_quality:
  score_excellent: 90.0
  score_good: 75.0
  score_warning: 50.0
  penalty_critical_error: 25.0
  penalty_error: 15.0
  penalty_warning: 5.0
  penalty_missing_value: 2.0
  max_tenure_months: 120
  max_monthly_charges: 3000.0
  allowed_contract_types:
    - "Month-to-Month"
    - "Month-to-month"
    - "1-Year"
    - "One year"
    - "One Year"
    - "2-Year"
    - "Two year"
    - "Two Year"
  allowed_plan_tiers:
    - "Basic"
    - "Standard"
    - "Premium"
    - "Enterprise"
    - "Prepaid Basic"
    - "Prepaid Unlimited"
    - "Postpaid Standard"
    - "Postpaid Premium"
  allowed_payment_methods:
    - "Electronic Check"
    - "Mailed Check"
    - "Bank Transfer"
    - "Credit Card"
    - "UPI"
    - "Net Banking"
    - "Auto-Debit"
    - "UPI/Credit Card"




